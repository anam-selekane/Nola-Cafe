<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nola Café | Enquiry</title>
</head>
<body>

<h1>Nola Café Enquiry Form</h1>

<nav>
    <a href="../index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="menu.html">Menu</a>
    <a href="contact.html">Contact Us</a>
    <a href="enquiry.html">Enquiry</a>
</nav>

<hr>

<p>Please fill in the form below and we will get back to you.</p>

<form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

    <label>Email Address:</label><br>
    <input type="email" name="email" placeholder="Enter your email" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone" placeholder="+27..." required><br><br>

    <label>Subject:</label><br>
    <select name="subject">
        <option>General Enquiry</option>
        <option>Table Reservation</option>
        <option>Menu Questions</option>
        <option>Feedback</option>
        <option>Other</option>
    </select><br><br>

    <label>Preferred Contact Method:</label><br>
    <input type="radio" name="contact" value="Email"> Email<br>
    <input type="radio" name="contact" value="Phone"> Phone<br><br>

    <label>Date of Visit (if booking):</label><br>
    <input type="date" name="date"><br><br>

    <label>Message:</label><br>
    <textarea name="message" rows="5" cols="40" placeholder="Write your message here..." required></textarea><br><br>

    <label>
        <input type="checkbox" required>
        I agree to be contacted by Nola Café
    </label><br><br>

    <input type="submit" value="Submit Enquiry">
    <input type="reset" value="Clear Form">

</form>

<hr>

<p><strong>Location:</strong> Walmer, Port Elizabeth</p>
<p><strong>Email:</strong> nolacafewalmer.co.za</p>

<p id="successMessage" style="color: black; font-weight: bold;">
    Thank you! Your enquiry has been submitted.
</p>

<hr>

<p>© 2026 Nola Café</p>

</body>
</html>
